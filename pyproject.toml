[project]
name = "rentory"
version = "0.1.1"
description = "Small CRM system"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "alembic>=1.19.1",
    "argon2-cffi>=25.1.0",
    "authlib>=1.7.2",
    "fastapi>=0.141.1",
    "httpx>=0.28.1",
    "itsdangerous>=2.2.0",
    "jinja2>=3.1.6",
    "joserfc>=1.7.4",
    "mysql-connector-python>=26.7.0",
    "pdf2image>=1.17.0",
    "phonenumbers>=9.0.37",
    "pillow>=12.3.0",
    "pydantic-extra-types>=2.11.1",
    "pydantic-settings>=2.15.0",
    "pydantic[email]>=2.13.4",
    "pyjwt>=2.13.0",
    "python-multipart>=0.0.32",
    "sqlmodel>=0.0.39",
    "systemd-python>=235",
    "uvicorn>=0.52.4",
    "weasyprint>=69.0",
]

[dependency-groups]
dev = [
    "httpx2>=2.12.0",
    "pytest>=9.1.1",
    "rich>=15.0.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = [
    "test_*.py",
    "*_test.py",
    "*_route.py",
    "*_routes.py",
    "*_service.py",
]
