[project]
name = "rentory"
version = "0.1.1"
description = "Small CRM system"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "alembic>=1.18.4",
    "argon2-cffi>=25.1.0",
    "authlib>=1.6.8",
    "fastapi>=0.129.0",
    "httpx>=0.28.1",
    "itsdangerous>=2.2.0",
    "jinja2>=3.1.6",
    "mysql-connector-python>=9.6.0",
    "phonenumbers>=9.0.24",
    "pillow>=12.1.1",
    "pydantic-extra-types>=2.11.0",
    "pydantic-settings>=2.13.1",
    "pydantic[email]>=2.12.4",
    "pyjwt>=2.11.0",
    "python-multipart>=0.0.22",
    "sqlmodel>=0.0.35",
    "systemd-python>=235",
    "uvicorn>=0.41.0",
    "weasyprint>=68.1",
]

[dependency-groups]
dev = [
    "pytest>=9.0.2",
    "rich>=14.3.3",
]
