[project]
name = "rentory"
version = "0.1.0"
description = "Small CRM system"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "alembic>=1.17.2",
    "argon2-cffi>=25.1.0",
    "authlib>=1.6.5",
    "fastapi>=0.121.0",
    "httpx>=0.28.1",
    "itsdangerous>=2.2.0",
    "jinja2>=3.1.6",
    "mysql-connector-python>=9.5.0",
    "phonenumbers>=9.0.17",
    "pillow>=12.0.0",
    "pydantic-extra-types>=2.10.6",
    "pydantic-settings>=2.11.0",
    "pydantic[email]>=2.12.4",
    "pyjwt>=2.10.1",
    "python-multipart>=0.0.20",
    "sqlmodel>=0.0.27",
    "systemd-python>=235",
    "uvicorn>=0.38.0",
    "weasyprint>=67.0",
]

[dependency-groups]
dev = [
    "pytest>=8.4.2",
    "rich>=14.2.0",
]
