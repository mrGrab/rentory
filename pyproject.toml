[project]
name = "rentory"
version = "0.1.1"
description = "Small CRM system"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "alembic>=1.20.1",
    "argon2-cffi>=25.1.0",
    "authlib>=1.9.5",
    "fastapi>=0.162.1",
    "httpx>=0.28.1",
    "itsdangerous>=2.2.0",
    "jinja2>=3.1.6",
    "joserfc>=1.8.0",
    "mysql-connector-python>=26.10.0",
    "pdf2image>=1.17.0",
    "phonenumbers>=9.0.43",
    "pillow>=13.0.0",
    "pydantic-extra-types>=2.11.1",
    "pydantic-settings>=2.16.2",
    "pydantic[email]>=2.14.3",
    "pyjwt>=2.15.1",
    "python-multipart>=0.0.33",
    # Pinned: 2.1.x passes raw UUIDs to mysql-connector on MariaDB (see docs/dependency-pins.md)
    "sqlalchemy>=2.0.52,<2.1",
    "sqlmodel>=0.0.48",
    "uvicorn>=0.54.0",
    "weasyprint>=70.0",
]

[dependency-groups]
dev = [
    "httpx2>=2.16.0",
    "pytest>=9.2.0",
    "rich>=15.0.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = [
    "test_*.py",
    "*_test.py",
    "*_route.py",
    "*_routes.py",
    "*_service.py",
    "*_query_gateway.py",
]
